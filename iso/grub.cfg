# UEFI boot menu. The guided install is the default.
# The "serial console" entries are for headless machines and the CI test:
# with console=ttyS0 the installer runs on the serial port, so on Hyper-V
# generation 2 and most real hardware the screen would stay black.
# Parameters after "---" are copied to the installed system's kernel line.
set timeout=5
set default=0

menuentry "Install Dahlia Linux" {
    linux /install.amd/vmlinuz priority=high --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Install Dahlia Linux (serial console)" {
    linux /install.amd/vmlinuz priority=high --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (no questions, default password)" {
    linux /install.amd/vmlinuz auto=true priority=critical dahlia.mode=auto --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (serial console)" {
    linux /install.amd/vmlinuz auto=true priority=critical dahlia.mode=auto --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}
