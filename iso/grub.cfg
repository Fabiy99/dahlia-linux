# UEFI boot: start the Dahlia installer after a short timeout.
# Entry 0 uses the screen only. Hyper-V generation 2 and most real hardware
# have no serial port; with console=ttyS0 the installer would run there and
# leave the screen black. Entry 1 is for headless machines and the CI test.
# Parameters after "---" are copied to the installed system's kernel line.
set timeout=3
set default=0

menuentry "Install Dahlia Linux" {
    linux /install.amd/vmlinuz auto=true priority=critical --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Install Dahlia Linux (serial console)" {
    linux /install.amd/vmlinuz auto=true priority=critical --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}
