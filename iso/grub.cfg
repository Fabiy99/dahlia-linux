# UEFI boot menu. The guided install is the default.
# The "serial console" entries are for headless machines and the CI test:
# with console=ttyS0 the installer runs on the serial port, so on Hyper-V
# generation 2 and most real hardware the screen would stay black.
# Parameters after "---" are copied to the installed system's kernel line.
set timeout=5
set default=0

# Dahlia theme (iso/grub-theme/, mapped to /boot/grub/dahlia). Without a
# graphics mode the plain text menu stays, in the same colours.
set menu_color_normal=light-gray/black
set menu_color_highlight=black/magenta
if loadfont $prefix/font.pf2; then
    set gfxmode=1024x768,auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    terminal_output gfxterm
    set theme=$prefix/dahlia/theme.txt
fi

# Installer dialogs in d-i's dark theme (before "---", installer only).
menuentry "Install Dahlia Linux" {
    linux /install.amd/vmlinuz theme=dark priority=high --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Install Dahlia Linux (serial console)" {
    linux /install.amd/vmlinuz theme=dark priority=high --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (password dahlia)" {
    linux /install.amd/vmlinuz theme=dark auto=true priority=critical dahlia.mode=auto --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (serial console)" {
    linux /install.amd/vmlinuz theme=dark auto=true priority=critical dahlia.mode=auto --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}
