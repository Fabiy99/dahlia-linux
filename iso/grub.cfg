# UEFI boot menu. The guided install is the default.
# The "serial console" entries are for headless machines and the CI test:
# with console=ttyS0 the installer runs on the serial port, so on Hyper-V
# generation 2 and most real hardware the screen would stay black.
# Parameters after "---" are copied to the installed system's kernel line.
set timeout=5
set default=0

# Dahlia theme (iso/grub-theme/, mapped to /boot/grub/dahlia). Without a
# graphics mode the plain text menu stays, in the same colours.
set menu_color_normal=light-gray/black
set menu_color_highlight=black/magenta
if loadfont $prefix/font.pf2; then
    set gfxmode=1024x768,auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    terminal_output gfxterm
    set theme=$prefix/dahlia/theme.txt
fi

# Console colours of the installer dialogs: d-i sets its own newt palette, so the
# 16 console colours are redefined instead (blue = background, lightgray = window,
# red = accent). They come before "---" and are not copied to the installed system.
set dahlia_vt="vt.default_red=12,176,0,170,26,170,0,235,110,224,85,255,85,255,85,255 vt.default_grn=10,72,170,85,22,0,170,232,104,140,255,255,85,85,255,255 vt.default_blu=15,148,0,0,32,170,170,240,120,200,85,85,255,255,255,255"

menuentry "Install Dahlia Linux" {
    linux /install.amd/vmlinuz $dahlia_vt priority=high --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Install Dahlia Linux (serial console)" {
    linux /install.amd/vmlinuz $dahlia_vt priority=high --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (password dahlia)" {
    linux /install.amd/vmlinuz $dahlia_vt auto=true priority=critical dahlia.mode=auto --- quiet
    initrd /install.amd/initrd.gz
}

menuentry "Automatic install (serial console)" {
    linux /install.amd/vmlinuz $dahlia_vt auto=true priority=critical dahlia.mode=auto --- quiet console=tty0 console=ttyS0,115200n8
    initrd /install.amd/initrd.gz
}
