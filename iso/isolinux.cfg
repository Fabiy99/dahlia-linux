# BIOS boot menu, same entries as grub.cfg. The guided install is the default.
ui vesamenu.c32
default dahlia
prompt 0
timeout 50

# Dahlia look: splash.png (iso/art/) with the wordmark top left, menu below it.
# Colours are #AARRGGBB; a zero alpha shows the splash through.
menu background splash.png
menu width 42
menu margin 0
menu hshift 4
menu vshift 12
menu rows 5
menu timeoutrow 19
menu tabmsgrow 21
menu tabmsg Arrow keys to choose, Enter to start
menu color screen       37;40 #00000000 #00000000 none
menu color border       30;40 #00000000 #00000000 none
menu color title        1;35  #00000000 #00000000 none
menu color unsel        37;40 #ffebe8f0 #00000000 none
menu color hotkey       35;40 #ffe08cc8 #00000000 none
menu color sel          7;37  #ff17151b #ffe08cc8 none
menu color hotsel       7;35  #ff17151b #ffe08cc8 none
menu color tabmsg       37;40 #ffa39eae #00000000 none
menu color timeout_msg  37;40 #ffa39eae #00000000 none
menu color timeout      35;40 #ffe08cc8 #00000000 none

label dahlia
  menu label Install Dahlia Linux
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz priority=high --- quiet

label dahlia-serial
  menu label Install Dahlia Linux (serial console)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz priority=high --- quiet console=tty0 console=ttyS0,115200n8

label dahlia-auto
  menu label Automatic install (password dahlia)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical dahlia.mode=auto --- quiet

label dahlia-auto-serial
  menu label Automatic install (serial console)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical dahlia.mode=auto --- quiet console=tty0 console=ttyS0,115200n8
