# BIOS boot menu, same entries as grub.cfg. The guided install is the default.
ui vesamenu.c32
menu title Dahlia Linux
default dahlia
prompt 0
timeout 50

label dahlia
  menu label Install Dahlia Linux
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz priority=high --- quiet

label dahlia-serial
  menu label Install Dahlia Linux (serial console)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz priority=high --- quiet console=tty0 console=ttyS0,115200n8

label dahlia-auto
  menu label Automatic install (no questions, default password)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical dahlia.mode=auto --- quiet

label dahlia-auto-serial
  menu label Automatic install (serial console)
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical dahlia.mode=auto --- quiet console=tty0 console=ttyS0,115200n8
