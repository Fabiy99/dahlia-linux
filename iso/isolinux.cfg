# BIOS boot: start the Dahlia installer directly (screen only).
# "dahlia-serial" is for headless machines and the CI test; see grub.cfg.
default dahlia
prompt 0
timeout 0

label dahlia
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical --- quiet

label dahlia-serial
  kernel /install.amd/vmlinuz
  append initrd=/install.amd/initrd.gz auto=true priority=critical --- quiet console=tty0 console=ttyS0,115200n8
