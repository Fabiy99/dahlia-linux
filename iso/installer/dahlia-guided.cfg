# Guided install (default menu entries, debconf priority high). d-i asks for
# the keyboard layout and the admin password itself; guided.sh asks for the
# disk, server name, time zone, network and SSH key when partman starts and
# shows the summary. The time zone here is replaced by guided.sh's answer;
# d-i would only offer the zones of the preseeded country.
d-i time/zone string Europe/Berlin
d-i partman/early_command string sh /cdrom/dahlia/guided.sh
