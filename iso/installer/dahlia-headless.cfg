# Install without a screen ("Install without screen" menu entry, prepared by
# the USB Creator of the Dahlia app). No questions on the server: German
# keyboard during the install, the layout from the stick is written to the
# installed system. headless.sh gets the disk, the account and its password
# from the app on the PC; the password below is replaced by late-command.sh.
d-i keyboard-configuration/xkb-keymap select de
d-i time/zone string Europe/Berlin
d-i passwd/username string dahlia-admin
d-i passwd/user-password-crypted password $6$dahliainstall$Alv6C4prZB/JGOT1b9K6pIPrIN9m.t88QAYWHU9HtTQf4y8Y2LWTqIHTfSCb53zU69sLYTimwfPo6XNRdM6dc1
d-i user-setup/allow-password-weak boolean true
d-i partman/early_command string sh /cdrom/dahlia/headless.sh
