# Dahlia Linux installer preseed for Debian 13 (trixie), amd64.
# Embedded as /preseed.cfg in the installer initrd, so d-i loads it without
# any boot parameter. Settings for both install modes; the mode-specific
# part comes from dahlia-guided.cfg or dahlia-auto.cfg (see the end).
# The installer is English only.

### Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string DE
d-i localechooser/supported-locales multiselect en_US.UTF-8, de_DE.UTF-8

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string dahlia
d-i netcfg/get_domain string
d-i netcfg/hostname string dahlia
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts
# No root password: the admin user gets sudo. The password is asked in the
# guided install; the unattended install sets "dahlia" (dahlia-auto.cfg).
# UID 1001 keeps UID/GID 1000 free for the shared 'dahlia' app group.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Dahlia Admin
d-i passwd/username string dahlia-admin
d-i passwd/user-uid string 1001
d-i user-setup/encrypt-home boolean false

### Clock
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Disk
# partman/early_command (target disk) is set per mode.
d-i partman-auto/method string regular
d-i partman/default_filesystem string btrfs
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Packages
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
# Also install to the removable EFI path; some boards forget NVRAM entries.
d-i grub-installer/force-efi-extra-removable boolean true

### Dahlia packages and finish
d-i preseed/late_command string sh /cdrom/dahlia/late-command.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

### Install mode
# "dahlia.mode=auto" on the kernel line (menu entry "Automatic install")
# selects the unattended install, everything else the guided one.
d-i preseed/include_command string if grep -q 'dahlia.mode=auto' /proc/cmdline; then echo /dahlia-auto.cfg; else echo /dahlia-guided.cfg; fi
