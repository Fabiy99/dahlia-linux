[project]
name = "dahlia-linux"
version = "0.0.0"
description = "Homelab server OS based on Debian 13"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# System tools are called with argument lists and absolute trust in PATH
# (root-owned). shell=True stays forbidden via S602.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
