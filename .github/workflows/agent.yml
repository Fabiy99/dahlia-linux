name: agent

on:
  pull_request:
    paths:
      - "packages/agent/**"
      - "packages/storage/**"
      - "tests/integration/agent.sh"
      - "tests/integration/apps.sh"
      - "tests/integration/system-data.sh"
      - "tests/integration/rollback-loop.sh"
      - "tools/build-packages.sh"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils mergerfs fuse3 xfsprogs btrfs-progs e2fsprogs jq python3-yaml nginx \
            avahi-daemon avahi-utils nftables

      - name: Drop the runner's /mnt fstab entry
        # Same as in storage.yml: the runner's /mnt resource disk entry
        # would become a failed dependency of every unit below /mnt.
        run: |
          sudo sed -i -E 's|^([^#].*[[:space:]]/mnt[[:space:]].*)$|# \1|' /etc/fstab
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mnt.mount || true

      - name: Build and install storage and agent
        run: |
          tools/build-packages.sh
          # The runner has Docker from its own packages, not docker.io.
          sudo dpkg --force-depends --force-confnew -i \
            build/pool/storage_*_all.deb build/pool/agent_*_all.deb
          docker info --format '{{.Name}} {{.ServerVersion}}'
          docker compose version

      - name: Integration test (agent)
        run: sudo tests/integration/agent.sh

      - name: Integration test (apps)
        run: sudo tests/integration/apps.sh

      - name: Integration test (app data on the system SSD)
        run: sudo tests/integration/system-data.sh

      - name: Integration test (rollback on Btrfs)
        run: sudo tests/integration/rollback-loop.sh

      - name: Agent journal on failure
        if: failure()
        run: |
          sudo journalctl -u agent.service -u agent.socket --no-pager | tail -100
          sudo journalctl -n 100 --no-pager -u 'mnt-*' || true
          sudo journalctl -n 60 --no-pager -u docker.service || true
          sudo journalctl -n 40 --no-pager -u mdns.service -u nginx.service || true
