name: storage

on:
  pull_request:
    paths:
      - "packages/dahlia-storage/**"
      - "tests/integration/storage-loop.sh"
      - "tools/build-packages.sh"
      - ".github/workflows/storage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils mergerfs fuse3 xfsprogs btrfs-progs e2fsprogs attr jq snapraid

      - name: Drop the runner's /mnt fstab entry
        # The hosted runner lists a resource disk for /mnt in fstab that fails
        # to mount; every unit below /mnt would inherit that failed
        # dependency. On Dahlia, /mnt is a plain directory on the root fs.
        run: |
          sudo sed -i -E 's|^([^#].*[[:space:]]/mnt[[:space:]].*)$|# \1|' /etc/fstab
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mnt.mount || true
          grep -n /mnt /etc/fstab || true

      - name: Build and install dahlia-storage
        run: |
          tools/build-packages.sh
          sudo dpkg -i build/pool/dahlia-storage_*_all.deb

      - name: Integration test (loop devices)
        run: sudo tests/integration/storage-loop.sh

      - name: Show units on failure
        if: failure()
        run: |
          ls -la /etc/systemd/system/*.mount || true
          sudo cat /etc/dahlia/storage.json || true
          sudo journalctl -n 200 --no-pager -u 'mnt-*' || true
          ls -l /dev/disk/by-uuid/ || true
          systemctl status mnt.mount --no-pager || true
          sudo journalctl -b --no-pager | grep -iE 'mnt|loop|by-uuid|dependency' | grep -v network-online | tail -80 || true
