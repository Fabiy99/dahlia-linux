name: iso

on:
  pull_request:
    paths:
      - "iso/**"
      - "packages/**"
      - "tools/**"
      - "VERSION"
      - ".github/workflows/iso.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag (e.g. v0.1.0) to attach the ISO to; empty = build and test only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Build and install-test in the same job: the ISO is too large to pass
  # between jobs as an artifact on a free private repository.
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: bios, install: auto}
          - {firmware: uefi, install: auto}
          - {firmware: bios, install: guided}
          - {firmware: uefi, install: guided}
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso cpio apt-utils gnupg dirmngr python3-yaml \
            qemu-system-x86 qemu-utils ovmf sshpass openssh-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build packages
        run: tools/build-packages.sh

      - name: Build ISO
        run: iso/build-iso.sh

      - name: Install and boot test
        run: |
          iso/test-install.sh ${{ matrix.firmware }} \
            build/dahlia-linux-$(cat VERSION)-amd64.iso ${{ matrix.install }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.firmware }}-${{ matrix.install }}
          path: |
            build/test-${{ matrix.firmware }}-${{ matrix.install }}/*.log
            build/*.sha256
          retention-days: 7
          if-no-files-found: ignore

  # Screenshots of boot menu and installer dialogs (artwork, colours) as an
  # artifact to look at; the install itself is tested above.
  screens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso cpio apt-utils gnupg dirmngr qemu-system-x86 qemu-utils ovmf

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build packages and ISO
        run: |
          tools/build-packages.sh
          iso/build-iso.sh

      - name: Screenshots
        run: python3 iso/screenshots.py ${{ matrix.firmware }} build/dahlia-linux-$(cat VERSION)-amd64.iso

      - uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.firmware }}
          path: build/screens-${{ matrix.firmware }}/*.png
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso cpio apt-utils gnupg dirmngr python3-yaml

      - name: Build packages and ISO
        run: |
          tools/build-packages.sh
          iso/build-iso.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="$(cat VERSION)"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          fi
          assets=(
            "build/dahlia-linux-$version-amd64.iso"
            "build/dahlia-linux-$version-amd64.iso.sha256"
          )
          # The release may already exist when it was created in the GitHub UI
          # (which is also what created the tag); then only attach the files.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Dahlia Linux $version" \
              --notes "Installer ISO for Dahlia Linux $version (BIOS and UEFI)."
          fi
