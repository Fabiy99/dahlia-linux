<main class="screen-main">
  <div class="screen-clock"><span id="screen-time"></span><span id="screen-date"></span></div>
  <section class="screen-info">
    <div class="screen-brand"><span class="brand">Dahlia</span><span id="screen-host"></span></div>
    <p id="screen-status" class="hero-status"><span class="dot"></span><span></span></p>
    <div id="screen-setup" class="card screen-setup" hidden>
      <b data-i18n="screen.setup_title"></b>
      <span id="screen-code" class="screen-code"></span>
      <small data-i18n="screen.setup_hint"></small>
    </div>
    <div id="screen-tiles" class="screen-tiles"></div>
    <div class="card screen-open">
      <div id="screen-qr" class="screen-qr"></div>
      <div class="screen-open-text"><b data-i18n="screen.open"></b><span id="screen-url"></span><small data-i18n="screen.open_hint"></small></div>
    </div>
  </section>
