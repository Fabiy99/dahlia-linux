<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dahlia">
<title>Dahlia, I love you ♥</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>

  <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M12 3c2 2.2 2 4.6 0 6.4C10 7.6 10 5.2 12 3Zm0 18c-2-2.2-2-4.6 0-6.4 2 1.8 2 4.2 0 6.4ZM3 12c2.2-2 4.6-2 6.4 0-1.8 2-4.2 2-6.4 0Zm18 0c-2.2 2-4.6 2-6.4 0 1.8-2 4.2-2 6.4 0ZM5.6 5.6c3-.2 4.7 1.5 4.5 4.5-3 .2-4.7-1.5-4.5-4.5Zm12.8 12.8c-3 .2-4.7-1.5-4.5-4.5 3-.2 4.7 1.5 4.5 4.5Zm0-12.8c.2 3-1.5 4.7-4.5 4.5-.2-3 1.5-4.7 4.5-4.5ZM5.6 18.4c-.2-3 1.5-4.7 4.5-4.5.2 3-1.5 4.7-4.5 4.5Z"/></symbol>
  <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/></symbol>
  <symbol id="i-storage" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><path d="M12 2.8 20 7v10l-8 4.2L4 17V7l8-4.2Z"/><path d="M4 7l8 4.2L20 7M12 11.2v10"/></symbol>
  <symbol id="i-domains" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z"/></symbol>
  <symbol id="i-jobs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>

  <symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></symbol>
  <symbol id="i-reboot" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx=".8"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="10" rx="1.5"/><path d="M6.5 10.5v3M10 10.5v3M14 10.5v3M17.5 10.5v3M5 17v2.5M19 17v2.5"/></symbol>
  <symbol id="i-network" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5V12M5.5 16.5V12h13v4.5"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v12M7 10.5l5 5 5-5M4.5 20.5h15"/></symbol>
  <symbol id="i-docker" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="8" rx="1.5"/><rect x="5.5" y="6" width="5" height="5" rx=".8"/><rect x="13.5" y="6" width="5" height="5" rx=".8"/><path d="M7 15h.01M12 15h.01M17 15h.01"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="M12 11.5v5M9.5 14 12 11.5 14.5 14"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 14.5h7M9 18h4"/></symbol>
  <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0Z"/><path d="M12 10v7"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5Z"/></symbol>
  <symbol id="i-parity" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></symbol>
  <symbol id="i-backup" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M6.5 9l3 3-3 3M12 15h5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</svg>

<div id="shell" class="shell">
  <aside id="sidebar" class="sidebar" hidden>
    <div class="side-brand"><svg class="logo"><use href="#i-logo"/></svg><span class="brand">Dahlia</span></div>
    <div class="side-host">
      <span class="dot ok"></span>
      <span id="side-hostname" class="side-hostname"></span>
      <span id="side-version" class="side-version"></span>
    </div>
    <nav id="nav">
      <button data-view="overview"><svg><use href="#i-overview"/></svg><span data-i18n="nav.overview"></span></button>
      <button data-view="storage"><svg><use href="#i-storage"/></svg><span data-i18n="nav.storage"></span></button>
      <button data-view="parity"><svg><use href="#i-parity"/></svg><span data-i18n="nav.parity"></span></button>
      <button data-view="shares"><svg><use href="#i-share"/></svg><span data-i18n="nav.shares"></span></button>
      <button data-view="apps"><svg><use href="#i-apps"/></svg><span data-i18n="nav.apps"></span><span id="nav-apps-badge" class="count" hidden></span></button>
      <button data-view="docker"><svg><use href="#i-docker"/></svg><span data-i18n="nav.docker"></span></button>
      <button data-view="domains"><svg><use href="#i-domains"/></svg><span data-i18n="nav.domains"></span></button>
      <button data-view="jobs"><svg><use href="#i-jobs"/></svg><span data-i18n="nav.jobs"></span></button>
      <button data-view="backup"><svg><use href="#i-backup"/></svg><span data-i18n="nav.backup"></span></button>
      <button data-view="log"><svg><use href="#i-log"/></svg><span data-i18n="nav.log"></span></button>
      <button data-view="terminal"><svg><use href="#i-terminal"/></svg><span data-i18n="nav.terminal"></span></button>
      <button data-view="updates"><svg><use href="#i-updates"/></svg><span data-i18n="nav.updates"></span></button>
      <button data-view="account"><svg><use href="#i-account"/></svg><span data-i18n="nav.account"></span></button>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <button id="menu" class="icon-btn menu-btn" hidden data-i18n-title="nav.menu"><svg><use href="#i-menu"/></svg></button>
      <h1 id="page-title"></h1>
      <span class="spacer"></span>
      <select id="lang" aria-label="Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
      <button id="logout" class="icon-btn" hidden data-i18n-title="nav.logout"><svg><use href="#i-logout"/></svg></button>
    </header>

    <main>
      <section id="view-setup" class="auth" hidden>
        <div class="card auth-card">
          <div class="auth-brand"><svg class="logo"><use href="#i-logo"/></svg><span class="brand">Dahlia</span></div>
          <h2 data-i18n="setup.title"></h2>
          <p class="hint" data-i18n="setup.intro"></p>
          <form id="setup-form">
            <label><span data-i18n="setup.code"></span><input name="code" autocomplete="off" required></label>
            <label><span data-i18n="field.username"></span><input name="username" autocomplete="username" required></label>
            <label><span data-i18n="field.password"></span><input name="password" type="password" autocomplete="new-password" required></label>
            <label><span data-i18n="field.password_repeat"></span><input name="password2" type="password" autocomplete="new-password" required></label>
            <label><span data-i18n="field.hostname"></span><input name="hostname" placeholder="dahlia"></label>
            <p class="hint" data-i18n="setup.hint"></p>
            <button type="submit" data-i18n="setup.submit"></button>
          </form>
        </div>
      </section>

      <section id="view-login" class="auth" hidden>
        <div class="card auth-card">
          <div class="auth-brand"><svg class="logo"><use href="#i-logo"/></svg><span class="brand">Dahlia</span></div>
          <h2 data-i18n="login.title"></h2>
          <form id="login-form">
            <label><span data-i18n="field.username"></span><input name="username" autocomplete="username" required></label>
            <label><span data-i18n="field.password"></span><input name="password" type="password" autocomplete="current-password" required></label>
            <label id="login-code" hidden><span data-i18n="login.code"></span><input name="code" autocomplete="one-time-code" spellcheck="false"></label>
            <button type="submit" data-i18n="login.submit"></button>
          </form>
        </div>
      </section>

      <section id="view-overview" hidden>
        <div class="tiles">
          <article class="card tile">
            <header><svg><use href="#i-server"/></svg><h2 data-i18n="overview.system"></h2></header>
            <dl id="system-info" class="facts"></dl>
            <div class="tile-actions">
              <button id="reboot" class="danger"><svg><use href="#i-reboot"/></svg><span data-i18n="overview.reboot"></span></button>
              <button id="poweroff" class="danger"><svg><use href="#i-power"/></svg><span data-i18n="overview.poweroff"></span></button>
            </div>
          </article>

          <article class="card tile">
            <header><svg><use href="#i-cpu"/></svg><h2 data-i18n="overview.cpu"></h2></header>
            <div class="gauge-row">
              <div id="cpu-gauge" class="gauge"></div>
              <dl id="cpu-info" class="facts compact"></dl>
            </div>
            <div id="cpu-history" class="spark"></div>
          </article>

          <article class="card tile">
            <header><svg><use href="#i-memory"/></svg><h2 data-i18n="overview.memory"></h2></header>
            <div class="gauge-row">
              <div id="mem-gauge" class="gauge"></div>
              <dl id="mem-info" class="facts compact"></dl>
            </div>
            <div id="mem-history" class="spark"></div>
          </article>

          <article class="card tile">
            <header><svg><use href="#i-thermo"/></svg><h2 data-i18n="overview.disks"></h2>
              <button class="link-btn" data-goto="storage" data-i18n="overview.manage"></button></header>
            <div id="overview-disks" class="disk-mini-list"><p class="empty" data-i18n="common.loading"></p></div>
          </article>

          <article class="card tile wide">
            <header><svg><use href="#i-storage"/></svg><h2 data-i18n="overview.storage"></h2>
              <button class="link-btn" data-goto="storage" data-i18n="overview.manage"></button></header>
            <div id="fs-list" class="usage-list"></div>
          </article>

          <article class="card tile">
            <header><svg><use href="#i-network"/></svg><h2 data-i18n="overview.network"></h2></header>
            <div id="net-info" class="net-list"></div>
          </article>

          <article class="card tile wide">
            <header><svg><use href="#i-apps"/></svg><h2 data-i18n="overview.apps"></h2>
              <button class="link-btn" data-goto="apps" data-i18n="overview.manage"></button></header>
            <div id="overview-apps" class="app-mini-list"></div>
          </article>

          <article class="card tile">
            <header><svg><use href="#i-jobs"/></svg><h2 data-i18n="overview.jobs"></h2>
              <button class="link-btn" data-goto="jobs" data-i18n="overview.manage"></button></header>
            <div id="overview-jobs" class="job-mini-list"></div>
          </article>
        </div>

        <article class="card">
          <div class="section-head">
            <h2 data-i18n="history.title"></h2>
            <div id="history-range" class="seg" role="group"></div>
          </div>
          <p id="history-empty" class="hint" data-i18n="history.empty" hidden></p>
          <div class="charts">
            <figure class="chart" id="chart-cpu"><figcaption><b data-i18n="history.cpu"></b><small></small></figcaption><div class="plot"></div></figure>
            <figure class="chart" id="chart-mem"><figcaption><b data-i18n="history.mem"></b><small></small></figcaption><div class="plot"></div></figure>
            <figure class="chart" id="chart-net"><figcaption><b data-i18n="history.net"></b><small></small></figcaption><div class="plot"></div></figure>
            <figure class="chart" id="chart-temp"><figcaption><b data-i18n="history.temp"></b><small></small></figcaption><div class="plot"></div></figure>
          </div>
        </article>
      </section>

      <section id="view-shares" hidden>
        <p id="shares-no-pool" class="notice" data-i18n="shares.no_pool" hidden></p>
        <article class="card">
          <div class="section-head">
            <h2 data-i18n="shares.title"></h2>
            <button id="share-new" class="primary" data-i18n="shares.new"></button>
          </div>
          <p class="hint" id="shares-hint"></p>
          <table class="shares">
            <thead><tr>
              <th data-i18n="shares.name"></th><th data-i18n="shares.security"></th>
              <th data-i18n="shares.users"></th><th data-i18n="shares.address"></th><th></th>
            </tr></thead>
            <tbody id="shares"></tbody>
          </table>
        </article>
        <article class="card">
          <h2 data-i18n="shares.users_title"></h2>
          <p class="hint" data-i18n="shares.users_hint"></p>
          <div id="smb-users" class="smb-users"></div>
          <form id="smb-user-form" class="inline-form">
            <label><span data-i18n="field.username"></span><input name="name" autocomplete="off" required></label>
            <label><span data-i18n="shares.password"></span><input name="password" type="password" autocomplete="new-password" required></label>
            <label><span data-i18n="field.password_repeat"></span><input name="password2" type="password" autocomplete="new-password" required></label>
            <button type="submit" data-i18n="shares.user_add"></button>
          </form>
        </article>
        <article class="card">
          <div class="section-head">
            <h2 data-i18n="remotes.title"></h2>
            <button id="remote-new" data-i18n="remotes.new"></button>
          </div>
          <p class="hint" data-i18n="remotes.hint"></p>
          <table class="shares">
            <thead><tr>
              <th data-i18n="shares.name"></th><th data-i18n="remotes.source"></th>
              <th data-i18n="remotes.path"></th><th data-i18n="remotes.state"></th><th></th>
            </tr></thead>
            <tbody id="remotes"></tbody>
          </table>
        </article>
      </section>

      <section id="view-storage" hidden>
        <div id="pool-summary" class="tiles pools"></div>
        <p class="hint" data-i18n="storage.hint"></p>
        <div id="import-status" class="notice" hidden></div>
        <div id="disks" class="disk-list"></div>
        <div class="actions"><button id="storage-refresh" data-i18n="common.refresh"></button></div>
        <article class="card">
          <h2 data-i18n="storage.settings_title"></h2>
          <form id="storage-settings">
            <label><span data-i18n="storage.minfreespace"></span>
              <span class="input-unit">
                <input name="free_value" type="number" min="1" max="999999" required>
                <select name="free_unit"></select>
              </span></label>
            <p class="hint" data-i18n="storage.minfreespace_hint"></p>
            <label><span data-i18n="storage.mover_age"></span><select name="mover_min_age_minutes"></select></label>
            <p class="hint" data-i18n="storage.mover_age_hint"></p>
            <label><span data-i18n="parity.threshold"></span>
              <input name="snapraid_delete_threshold" type="number" min="0" max="100000" required></label>
            <p class="hint" data-i18n="parity.threshold_hint"></p>
            <div class="actions"><button type="submit" class="primary" data-i18n="common.save"></button></div>
          </form>
        </article>
      </section>

      <section id="view-parity" hidden>
        <div id="parity-notice" class="notice" hidden></div>
        <div class="tiles two">
          <article class="card">
            <h2 data-i18n="parity.state_title"></h2>
            <dl id="parity-state" class="facts"></dl>
            <p class="hint" data-i18n="parity.schedule_hint"></p>
            <div class="actions">
              <button id="parity-sync" class="primary" data-i18n="parity.sync"></button>
              <button id="parity-scrub" data-i18n="parity.scrub"></button>
              <button id="parity-refresh" data-i18n="common.refresh"></button>
            </div>
          </article>
          <article class="card">
            <h2 data-i18n="parity.disks_title"></h2>
            <table>
              <thead><tr>
                <th data-i18n="parity.disk"></th><th data-i18n="parity.size"></th>
                <th data-i18n="parity.files"></th><th data-i18n="parity.state"></th>
              </tr></thead>
              <tbody id="parity-disks"></tbody>
            </table>
            <p class="hint" data-i18n="parity.what"></p>
          </article>
          <article class="card">
            <h2 data-i18n="parity.restore_title"></h2>
            <ol class="steps">
              <li data-i18n="parity.restore_step1"></li>
              <li data-i18n="parity.restore_step2"></li>
              <li data-i18n="parity.restore_step3"></li>
            </ol>
            <form id="parity-restore" class="inline-form">
              <label><span data-i18n="parity.disk"></span><select name="disk"></select></label>
              <div class="actions"><button type="submit" data-i18n="parity.restore"></button></div>
            </form>
          </article>
          <article class="card">
            <h2 data-i18n="parity.settings_title"></h2>
            <form id="parity-settings">
              <label><span data-i18n="parity.threshold"></span>
                <input name="snapraid_delete_threshold" type="number" min="0" max="100000" required></label>
              <p class="hint" data-i18n="parity.threshold_hint"></p>
              <label><span data-i18n="parity.scrub_percent"></span>
                <input name="scrub_percent" type="number" min="1" max="100" required></label>
              <label><span data-i18n="parity.scrub_age"></span>
                <input name="scrub_older_than_days" type="number" min="0" max="3650" required></label>
              <div class="actions"><button type="submit" class="primary" data-i18n="common.save"></button></div>
            </form>
          </article>
        </div>
      </section>

      <section id="view-apps" hidden>
        <div class="section-head">
          <h2 data-i18n="apps.installed"></h2>
          <button id="apps-update-all" class="primary" hidden></button>
          <button id="apps-custom" data-i18n="custom.add"></button>
        </div>
        <div id="apps-installed" class="app-grid"></div>

        <div class="section-head">
          <h2 data-i18n="apps.catalog"></h2>
          <button id="apps-refresh" data-i18n="apps.refresh"></button>
        </div>
        <p class="hint" data-i18n="apps.hint"></p>
        <p class="hint" id="apps-refreshed"></p>
        <div class="filters">
          <input id="apps-search" type="search" data-i18n-placeholder="apps.search">
          <select id="apps-category"></select>
        </div>
        <div id="apps-catalog" class="app-grid catalog"></div>
      </section>

      <section id="view-docker" hidden>
        <div id="docker-disk" class="tiles stats-row"></div>
        <article class="card">

                  </select>

                <label><span data-i18n="influx.url"></span><input name="url" autocomplete="off" placeholder="http://192.168.1.10:8086"></label>
                <div id="influx-v2" class="field-group">
                  <label><span data-i18n="influx.org"></span><input name="org" autocomplete="off"></label>
                  <label><span data-i18n="influx.bucket"></span><input name="bucket" autocomplete="off"></label>
                  <label><span data-i18n="influx.token"></span><input name="token" type="password" autocomplete="off"></label>
                </div>
                <div id="influx-v1" class="field-group">
                  <label><span data-i18n="influx.database"></span><input name="database" autocomplete="off"></label>
                  <label><span data-i18n="influx.username"></span><input name="username" autocomplete="off"></label>
                  <label><span data-i18n="influx.password"></span><input name="password" type="password" autocomplete="off"></label>
                </div>
              </div>
              <button type="submit" data-i18n="common.save"></button>
            </form>
          </article>
          <article class="card">
            <h2 data-i18n="ups.title"></h2>
            <dl id="ups-status" class="facts"></dl>
            <form id="ups-form">
              <label><span data-i18n="ups.mode"></span>
                <select name="mode">
                  <option value="off" data-i18n="ups.mode_off"></option>
                  <option value="usb" data-i18n="ups.mode_usb"></option>
                  <option value="remote" data-i18n="ups.mode_remote"></option>
                </select>
              </label>
              <div id="ups-remote" class="field-group">
                <label><span data-i18n="ups.host"></span><input name="host" autocomplete="off"></label>
                <label><span data-i18n="ups.port"></span><input name="port" type="number" autocomplete="off" min="1" max="65535"></label>
                <label><span data-i18n="ups.name"></span><input name="name" autocomplete="off"></label>
                <label><span data-i18n="ups.user"></span><input name="user" autocomplete="off"></label>
                <label><span data-i18n="ups.password"></span><input name="password" type="password" autocomplete="off"></label>
              </div>
              <label><span data-i18n="ups.shutdown"></span><select name="shutdown_minutes"></select></label>
              <p class="hint" data-i18n="ups.hint"></p>
              <button type="submit" data-i18n="common.save"></button>
            </form>
          </article>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="reconnect" class="reconnect" role="status" data-i18n="error.reconnecting" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<dialog id="dialog">
  <form method="dialog">
    <p id="dialog-text"></p>
    <div class="dialog-actions">
      <button value="cancel" id="dialog-cancel" data-i18n="common.cancel"></button>
      <button value="ok" id="dialog-ok" class="primary" data-i18n="common.ok"></button>
    </div>
  </form>
</dialog>

<dialog id="share-dialog">
  <form id="share-form" method="dialog">
    <h2 id="share-dialog-title"></h2>
    <label><span data-i18n="shares.name"></span><input name="name" autocomplete="off" required></label>
    <label><span data-i18n="shares.comment"></span><input name="comment" autocomplete="off"></label>
    <label><span data-i18n="shares.security"></span>
      <select name="security">
        <option value="public" data-i18n="security.public"></option>
        <option value="secure" data-i18n="security.secure"></option>
        <option value="private" data-i18n="security.private"></option>
      </select>
    </label>
    <p class="hint" id="share-security-hint"></p>
    <div id="share-users" class="field-group"></div>
    <label class="check" id="share-nfs"><input name="nfs" type="checkbox"><span data-i18n="shares.nfs"></span></label>
    <p class="hint" id="share-nfs-hint"></p>
    <label class="check"><input name="time_machine" type="checkbox"><span data-i18n="shares.time_machine"></span></label>
    <label id="share-tm-size"><span data-i18n="shares.time_machine_size"></span><input name="time_machine_size" type="number" min="0" max="1000000" step="1"></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="primary" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<dialog id="remote-dialog">
  <form id="remote-form" method="dialog">
    <h2 id="remote-title"></h2>
    <label><span data-i18n="remotes.name"></span><input name="name" autocomplete="off" required pattern="[a-z0-9][a-z0-9\-]{0,31}"></label>
    <label><span data-i18n="remotes.type"></span>
      <select name="type">
        <option value="smb" data-i18n="remotes.type_smb"></option>
        <option value="nfs" data-i18n="remotes.type_nfs"></option>
      </select>
    </label>
    <label><span data-i18n="remotes.host"></span><input name="host" autocomplete="off" required data-i18n-placeholder="remotes.host_placeholder"></label>
    <label><span id="remote-share-label"></span><input name="share" autocomplete="off" required></label>
    <div id="remote-login">
      <label><span data-i18n="remotes.username"></span><input name="username" autocomplete="off"></label>
      <label><span data-i18n="remotes.password"></span><input name="password" type="password" autocomplete="new-password"></label>
      <p class="hint" id="remote-login-hint"></p>
    </div>
    <label class="check"><input name="readonly" type="checkbox"><span data-i18n="remotes.readonly"></span></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="primary" data-i18n="remotes.connect"></button>
    </div>
  </form>
</dialog>

<dialog id="smb-password-dialog">
  <form id="smb-password-form" method="dialog">
    <h2 id="smb-password-title"></h2>
    <label><span data-i18n="shares.password"></span><input name="password" type="password" autocomplete="new-password" required></label>
    <label><span data-i18n="field.password_repeat"></span><input name="password2" type="password" autocomplete="new-password" required></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="primary" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<dialog id="import-dialog">
  <form id="import-form" method="dialog">
    <h2 id="import-title"></h2>
    <p class="hint" id="import-text"></p>
    <label><span data-i18n="storage.import_target"></span>
      <span class="input-prefix"><code data-i18n="storage.import_prefix"></code><input name="target" autocomplete="off" required pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,63}"></span>
    </label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="primary" data-i18n="storage.import_start"></button>
    </div>
  </form>
</dialog>

<dialog id="format-dialog">
  <form id="format-form" method="dialog">
    <h2 id="format-title"></h2>
    <p class="hint" id="format-warning"></p>
    <label><span data-i18n="storage.format_fs"></span>
      <select name="filesystem">
        <option value="xfs" data-i18n="storage.fs_xfs"></option>
        <option value="ext4" data-i18n="storage.fs_ext4"></option>
        <option value="btrfs" data-i18n="storage.fs_btrfs"></option>
      </select>
    </label>
    <label><span id="format-confirm-label"></span><input name="confirm" autocomplete="off" required></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="danger" data-i18n="storage.format_now"></button>
    </div>
  </form>
</dialog>

<dialog id="burnin-dialog">
  <form id="burnin-form" method="dialog">
    <h2 id="burnin-title"></h2>
    <p class="hint" id="burnin-warning"></p>
    <label><span id="burnin-confirm-label"></span><input name="confirm" autocomplete="off" required></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" class="danger" data-i18n="burnin.start_now"></button>
    </div>
  </form>
</dialog>

<dialog id="install-dialog" class="wide-dialog">
  <form id="install-form" method="dialog">
    <h2 id="install-title"></h2>
    <p class="hint" id="install-desc"></p>
    <ul id="install-checks" class="checks"></ul>
    <h3 data-i18n="install.location"></h3>
    <div id="install-location" class="places"></div>
    <p class="hint" id="install-appdata"></p>
    <h3 data-i18n="install.folders"></h3>
    <p class="hint" data-i18n="install.folders_hint"></p>
    <div id="install-shares" class="field-group"></div>
    <p class="hint" id="install-notes"></p>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" id="install-ok" class="primary" data-i18n="apps.install"></button>
    </div>
  </form>
</dialog>

<dialog id="wg-peer-dialog" class="wide-dialog">
  <form method="dialog">
    <h2 id="wg-peer-title"></h2>
    <p class="hint" data-i18n="vpn.peer_once"></p>
    <div class="wg-peer">
      <img id="wg-peer-qr" alt="">
      <pre id="wg-peer-config"></pre>
    </div>
    <div class="dialog-actions">
      <a id="wg-peer-download" class="button" data-i18n="vpn.peer_download"></a>
      <button value="ok" class="primary" data-i18n="common.ok"></button>
    </div>
  </form>
</dialog>

<dialog id="custom-dialog" class="wide-dialog">
  <form id="custom-form" method="dialog">
    <h2 id="custom-title"></h2>
    <p class="hint" data-i18n="custom.hint"></p>
    <div class="custom-grid">
      <label><span data-i18n="custom.id"></span>
        <input name="id" autocomplete="off" required pattern="[a-z][a-z0-9\-]{1,30}"></label>
      <label><span data-i18n="custom.name"></span>
        <input name="name" autocomplete="off" required maxlength="40"></label>
      <label class="wide"><span data-i18n="custom.image"></span>
        <input name="image" autocomplete="off" required data-i18n-placeholder="custom.image_placeholder"></label>
      <label><span data-i18n="custom.web_port"></span>
        <input name="web_port" type="number" min="1" max="65535"></label>
      <label><span data-i18n="custom.public_port"></span>
        <input name="public_port" type="number" min="1" max="65535"></label>
    </div>
    <p class="hint" data-i18n="custom.web_hint"></p>
    <div id="custom-location-box">
      <h3 data-i18n="install.location"></h3>
      <div id="custom-location" class="places"></div>
    </div>
    <h3 data-i18n="custom.lan_ports"></h3>
    <div id="custom-ports" class="custom-rows"></div>
    <button type="button" id="custom-add-port" data-i18n="custom.add_port"></button>
    <h3 data-i18n="custom.volumes"></h3>
    <p class="hint" id="custom-volumes-hint"></p>
    <div id="custom-volumes" class="custom-rows"></div>
    <button type="button" id="custom-add-volume" data-i18n="custom.add_volume"></button>
    <h3 data-i18n="custom.environment"></h3>
    <p class="hint" data-i18n="custom.environment_hint"></p>
    <div id="custom-env" class="custom-rows"></div>
    <button type="button" id="custom-add-env" data-i18n="custom.add_env"></button>
    <label class="check" id="custom-gpu-box"><input name="gpu" type="checkbox"><span data-i18n="custom.gpu"></span></label>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" id="custom-ok" class="primary"></button>
    </div>
  </form>
</dialog>

<dialog id="folder-dialog" class="wide-dialog">
  <form id="folder-form" method="dialog">
    <h2 data-i18n="folder.title"></h2>
    <div id="folder-roots" class="places"></div>
    <nav id="folder-crumbs" class="crumbs"></nav>
    <ul id="folder-list" class="folder-list"></ul>
    <div class="folder-new">
      <input id="folder-new-name" autocomplete="off" data-i18n-placeholder="folder.new_placeholder">
      <button type="button" id="folder-new" data-i18n="folder.new"></button>
    </div>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate data-i18n="common.cancel"></button>
      <button value="ok" id="folder-ok" class="primary" data-i18n="folder.choose"></button>
    </div>
  </form>
</dialog>

<dialog id="logs-dialog" class="wide-dialog">
  <div class="dialog-head">
    <h2 id="logs-title"></h2>
    <button id="logs-refresh" data-i18n="common.refresh"></button>
    <button id="logs-close" data-i18n="common.close"></button>
  </div>
  <pre id="logs-output" class="logbox"></pre>
</dialog>

<template id="disk-row">
  <div class="part">
    <div class="part-main">
      <span class="path"></span>
      <span class="fs"></span>
      <span class="size"></span>
      <span class="badge status"></span>
    </div>
    <div class="part-usage"></div>
    <div class="ops">
      <select class="role">
        <option value="data" data-i18n="role.data"></option>
        <option value="parity" data-i18n="role.parity"></option>
        <option value="cache" data-i18n="role.cache"></option>
        <option value="external" data-i18n="role.external"></option>
      </select>
      <button class="add" data-i18n="storage.add"></button>
      <button class="remove danger" data-i18n="storage.remove"></button>
      <button class="import" data-i18n="storage.import"></button>
      <button class="format danger" data-i18n="storage.format"></button>
    </div>
  </div>
</template>
</body>
</html>
